<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatGPT 台股三個月績效追蹤</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1c232d; --line:#2a323d;
  --fg:#e6edf3; --dim:#8b98a5; --faint:#5d6b7a;
  --up:#f2544b; --down:#26a269; --flat:#8b98a5;   /* 台股慣例：紅漲綠跌 */
  --accent:#58a6ff; --warn:#e3b341;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --line:#d8dee4;
    --fg:#1f2328; --dim:#5a6672; --faint:#8b949e;
    --accent:#0969da;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6}
.wrap{max-width:1220px;margin:0 auto;padding:20px 16px 60px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:22px;margin:0 0 2px;letter-spacing:.5px}
h2{font-size:15px;margin:0 0 12px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:1.2px}
h3{font-size:15px;margin:0}
.mono{font-variant-numeric:tabular-nums;
  font-family:"SF Mono",Consolas,"Cascadia Mono",monospace}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.dim{color:var(--dim)} .faint{color:var(--faint)}

header{display:flex;justify-content:space-between;align-items:flex-end;
  flex-wrap:wrap;gap:12px;padding-bottom:16px;margin-bottom:20px;
  border-bottom:1px solid var(--line)}
.sub{color:var(--dim);font-size:12.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  letter-spacing:.5px}
.badge.sim{border-color:var(--warn);color:var(--warn)}

.quick-nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;
  margin:0 -4px 22px;padding:9px 4px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.quick-nav a{white-space:nowrap;padding:5px 10px;border-radius:7px;color:var(--dim);
  font-size:12px;border:1px solid transparent}
.quick-nav a:hover{color:var(--fg);border-color:var(--line);background:var(--panel);text-decoration:none}

.contest{display:grid;grid-template-columns:minmax(260px,1.4fr) minmax(240px,1fr);
  gap:14px;margin-bottom:20px}
.contest .panel{height:100%}
.contest-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.contest-title{font-size:18px;font-weight:650;line-height:1.35}
.contest-status{font-size:11px;color:var(--accent);border:1px solid var(--accent);
  border-radius:99px;padding:2px 8px;white-space:nowrap}
.progress-track,.allocation-track{height:9px;border-radius:99px;background:var(--panel2);
  overflow:hidden;margin:14px 0 7px}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6)}
.allocation-track{display:flex;height:12px}
.allocation-track .invested{background:var(--accent)}
.allocation-track .cash{background:var(--warn)}
.contest-meta{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px}
.risk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.risk-grid .v{font-size:18px;font-weight:650;margin-top:2px}
.risk-grid .l{font-size:11px;color:var(--dim);letter-spacing:.5px}

section{margin-bottom:32px}
.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px}
.kpi .label{font-size:11.5px;color:var(--dim);letter-spacing:.6px;margin-bottom:5px}
.kpi .value{font-size:21px;font-weight:600;letter-spacing:-.3px}
.kpi .note{font-size:11.5px;color:var(--faint);margin-top:3px}

/* 圖表 */
.chartbox{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:10px;
  flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2.5px;vertical-align:middle;
  margin-right:5px;border-radius:2px}

/* 持倉 */
.holds{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.hold{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:15px}
.hold .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hold .code{font-size:12px;color:var(--dim)}
.hold .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;
  margin:12px 0;font-size:12.5px}
.hold .grid div{display:flex;justify-content:space-between;
  border-bottom:1px dashed var(--line);padding-bottom:3px}
.thesis{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px}
.thesis .t{font-weight:600;margin-bottom:5px}
.thesis p{margin:5px 0;color:var(--dim)}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:9px 0 4px}
.bar i{display:block;height:100%;background:var(--accent)}
.spark{height:38px;margin-top:8px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11.5px;
  letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:"SF Mono",Consolas,monospace}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.buy{color:var(--up);border-color:var(--up)}
.tag.sell{color:var(--down);border-color:var(--down)}
.tag.hold,.tag.watch,.tag.pass{color:var(--dim)}
.scroll{overflow-x:auto}
.snapshot-details summary{cursor:pointer;font-weight:600}
.archive-tools{display:flex;gap:10px;align-items:center;margin:-5px 0 12px;flex-wrap:wrap}
.archive-search{min-width:min(360px,100%);flex:1;background:var(--panel);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
.archive-search:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}

/* 簡報 */
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.brief .item .h{font-size:11.5px;color:var(--dim);letter-spacing:.8px;
  text-transform:uppercase;margin-bottom:5px}
.brief .item p{margin:0;font-size:13px;white-space:pre-wrap}
.stance{font-size:16px;font-weight:600;padding:10px 14px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:14px}

/* 總經格 */
.macro{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mc .n{font-size:11.5px;color:var(--dim);margin-bottom:3px}
.mc .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.mc .c{font-size:11.5px;font-variant-numeric:tabular-nums}

/* 事件 */
.ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev .d{min-width:78px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.ev .t{flex:1;font-size:13px}
.ev .s{color:var(--warn);font-size:12px;letter-spacing:1px}

.news-item{padding:10px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:none}
.news-item .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.news-item .s{font-size:12px;color:var(--faint)}
.news-item p{margin:4px 0 0;color:var(--dim);font-size:12.5px}

/* 每日紀錄存檔 */
details.panel summary{cursor:pointer;list-style:none;outline:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::before{content:"▸";color:var(--dim);margin-right:8px;
  display:inline-block;transition:transform .15s}
details.panel[open] summary::before{transform:rotate(90deg)}
details.panel summary:hover{color:var(--accent)}
.sub-h{font-size:11.5px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;
  margin:16px 0 4px;padding-top:12px;border-top:1px solid var(--line)}

.empty{color:var(--faint);font-size:13px;padding:14px 0;text-align:center}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--faint);font-size:12px;line-height:1.8}
.disclaimer{background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:6px;padding:12px 14px;
  font-size:12.5px;color:var(--dim);margin-bottom:24px}
@media(max-width:720px){
  .wrap{padding:14px 12px 44px}.contest{grid-template-columns:1fr}.kpi .value{font-size:19px}
  .quick-nav{margin-bottom:16px}.holds{grid-template-columns:1fr}.brief{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<script id="payload" type="application/json">/*__DATA__*/null</script>
<div id="app"></div>
</div>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);

// ── 格式化 ──────────────────────────────────────────────
const n0 = v => v == null ? '—' : Math.round(v).toLocaleString('en-US');
const n2 = (v, d = 2) => v == null ? '—' : v.toLocaleString('en-US',
  {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 2) => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d) + '%';
const cls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');

// ── 折線圖：淨值 vs 大盤（都轉成累積報酬 %）────────────────
function equityChart(snaps) {
  if (!snaps || !snaps.length) {
    return `<div class="empty">第一份績效快照建立後，這裡會出現淨值曲線</div>`;
  }
  const W = 1000, H = 260, P = {t: 14, r: 54, b: 26, l: 8};
  const me = snaps.map(s => s.cum_return_pct ?? 0);
  const mk = snaps.map(s => s.twii_cum_pct);
  const all = me.concat(mk.filter(v => v != null)).concat([0]);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = Math.max((hi - lo) * 0.15, 0.4);
  lo -= pad; hi += pad;
  const x = i => P.l + i * (W - P.l - P.r) / Math.max(snaps.length - 1, 1);
  const y = v => P.t + (hi - v) * (H - P.t - P.b) / (hi - lo);
  const path = arr => arr.map((v, i) => v == null ? null
    : `${i && arr[i-1] != null ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`)
    .filter(Boolean).join(' ');

  const ticks = [];
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    ticks.push(`<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"
      stroke="var(--line)" stroke-width="1" ${Math.abs(v) < 1e-9 ? '' : 'opacity=".55"'}/>
      <text x="${W - P.r + 8}" y="${y(v) + 4}" fill="var(--dim)" font-size="12">${v.toFixed(1)}%</text>`);
  }
  const zero = (lo <= 0 && hi >= 0)
    ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(0)}" y2="${y(0)}"
       stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>` : '';
  const labels = snaps.map((s, i) =>
    (i === 0 || i === snaps.length - 1 || (snaps.length > 8 && i % Math.ceil(snaps.length / 6) === 0))
      ? `<text x="${x(i)}" y="${H - 6}" fill="var(--faint)" font-size="11"
         text-anchor="${i === 0 ? 'start' : i === snaps.length - 1 ? 'end' : 'middle'}"
         >${s.date.slice(5)}</text>` : '').join('');

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="淨值與大盤累積報酬對照">
    ${ticks.join('')}${zero}${labels}
    <path d="${path(mk)}" fill="none" stroke="var(--dim)" stroke-width="1.6"
      stroke-dasharray="5 4" stroke-linejoin="round"/>
    <path d="${path(me)}" fill="none" stroke="var(--accent)" stroke-width="2.4"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${me.length ? `<circle cx="${x(me.length-1)}" cy="${y(me[me.length-1])}" r="4"
      fill="var(--accent)"/>` : ''}
  </svg>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>本帳戶 ${pct(me[me.length-1])}</span>
    <span><i style="background:var(--dim)"></i>加權指數 ${pct(mk[mk.length-1])}</span>
    <span class="faint">起算日 ${esc(D.account.start_date)}</span>
  </div>`;
}

// 迷你走勢圖
function spark(code) {
  const s = (D.series || {})[code];
  if (!s || s.length < 3) return '';
  const v = s.map(p => p.close), W = 300, H = 38;
  const lo = Math.min(...v), hi = Math.max(...v), rg = (hi - lo) || 1;
  const d = v.map((c, i) =>
    `${i ? 'L' : 'M'}${(i * W / (v.length - 1)).toFixed(1)},${(H - (c - lo) / rg * (H - 4) - 2).toFixed(1)}`
  ).join(' ');
  const col = v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
}

// ── 區塊 ────────────────────────────────────────────────
function contestOverview() {
  const a = D.account;
  const start = new Date(`${a.start_date}T00:00:00`);
  const end = new Date(`${a.end_date}T00:00:00`);
  const asOf = new Date(`${D.as_of}T00:00:00`);
  const day = 86400000;
  const totalDays = Math.max(1, Math.round((end - start) / day) + 1);
  const elapsed = Math.max(0, Math.min(totalDays, Math.round((asOf - start) / day) + 1));
  const progress = elapsed / totalDays * 100;
  const remaining = Math.max(0, Math.round((end - asOf) / day));
  const phase = asOf < start ? '賽前準備' : asOf > end ? '賽事結束' : '賽事進行中';
  const exposure = a.total_equity ? a.positions_value / a.total_equity * 100 : 0;
  const cash = Math.max(0, 100 - exposure);
  const safety = a.total_equity - a.knockout_equity;
  return `<div class="contest">
    <div class="panel">
      <div class="contest-top">
        <div><div class="contest-title">三個月績效追蹤</div>
          <div class="sub">${esc(a.start_date)} → ${esc(a.end_date)} · 每日持續累積</div></div>
        <span class="contest-status">${phase}</span>
      </div>
      <div class="progress-track" aria-label="賽程進度 ${progress.toFixed(1)}%"><i style="width:${progress.toFixed(1)}%"></i></div>
      <div class="contest-meta"><span>第 ${elapsed} / ${totalDays} 天</span><span>${remaining} 天後結算</span></div>
      <div class="allocation-track" aria-label="資產配置：持股 ${exposure.toFixed(1)}%，現金 ${cash.toFixed(1)}%">
        <span class="invested" style="width:${exposure.toFixed(1)}%"></span><span class="cash" style="width:${cash.toFixed(1)}%"></span>
      </div>
      <div class="contest-meta"><span>持股 ${exposure.toFixed(1)}%</span><span>現金 ${cash.toFixed(1)}%</span></div>
    </div>
    <div class="panel risk-grid">
      <div><div class="l">距淘汰線</div><div class="v ${cls(safety)}">${n0(safety)}</div></div>
      <div><div class="l">歷史高點</div><div class="v">${n0(a.peak_equity)}</div></div>
      <div><div class="l">目前回撤</div><div class="v ${cls(a.current_drawdown_pct)}">${pct(a.current_drawdown_pct)}</div></div>
      <div><div class="l">最大回撤</div><div class="v ${cls(a.max_drawdown_pct)}">${pct(a.max_drawdown_pct)}</div></div>
    </div>
  </div>`;
}

function kpis() {
  const a = D.account;
  const vs = (a.cum_return_pct != null && a.twii_cum_pct != null)
    ? a.cum_return_pct - a.twii_cum_pct : null;
  const card = (label, value, note, klass) => `<div class="kpi">
    <div class="label">${label}</div>
    <div class="value ${klass || ''}">${value}</div>
    ${note ? `<div class="note">${note}</div>` : ''}</div>`;
  return `<div class="kpis">
    ${card('總資產', n0(a.total_equity), `初始 ${n0(a.initial_cash)}`)}
    ${card('累積報酬', pct(a.cum_return_pct),
        vs == null ? '' : `對大盤 ${pct(vs)}`, cls(a.cum_return_pct))}
    ${card('現金', n0(a.cash), `水位 ${a.cash_pct.toFixed(1)}%`)}
    ${card('未實現損益', n0(a.unrealized_pnl), `持股市值 ${n0(a.positions_value)}`,
        cls(a.unrealized_pnl))}
    ${card('已實現損益', n0(a.realized_pnl_cum),
        a.closed_count ? `平倉 ${a.closed_count} 次 · 勝率 ${a.win_rate_pct?.toFixed(0) ?? '—'}%`
                       : '尚無平倉', cls(a.realized_pnl_cum))}
    ${card('累計交易成本', n0(a.fees_cum), `${a.trade_count} 筆成交`)}
    ${card('紀錄天數', n0(a.record_days), '決策、觀察與績效快照')}
  </div>`;
}

function snapshotsTable() {
  if (!D.snapshots.length) return `<div class="empty">尚無每日績效快照</div>`;
  return `<details class="panel snapshot-details"><summary>展開每日績效明細（${D.snapshots.length} 日）</summary>
    <div class="scroll" style="margin-top:12px"><table>
      <thead><tr><th>日期</th><th class="num">總資產</th><th class="num">單日</th>
        <th class="num">累積</th><th class="num">大盤同期</th><th class="num">現金</th>
        <th class="num">持股市值</th><th class="num">累計費稅</th><th>備註</th></tr></thead>
      <tbody>${[...D.snapshots].reverse().map(s => `<tr>
        <td class="mono dim">${esc(s.date)}</td><td class="num">${n0(s.total_equity)}</td>
        <td class="num ${cls(s.day_return_pct)}">${pct(s.day_return_pct)}</td>
        <td class="num ${cls(s.cum_return_pct)}">${pct(s.cum_return_pct)}</td>
        <td class="num ${cls(s.twii_cum_pct)}">${pct(s.twii_cum_pct)}</td>
        <td class="num">${n0(s.cash)}</td><td class="num">${n0(s.positions_value)}</td>
        <td class="num dim">${n0(s.fees_cum)}</td><td>${esc(s.note || '')}</td>
      </tr>`).join('')}</tbody></table></div></details>`;
}

function holdings() {
  if (!D.holdings.length) return `<div class="panel empty">目前空手 — 尚未建立任何部位</div>`;
  return `<div class="holds">` + D.holdings.map(h => {
    const t = h.thesis;
    let progress = '';
    if (t && t.target_price && t.stop_loss) {
      const lo = t.stop_loss, hi = t.target_price;
      const p = Math.max(0, Math.min(100, (h.price - lo) / (hi - lo) * 100));
      progress = `<div class="bar"><i style="width:${p.toFixed(1)}%"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:11px" class="faint">
          <span>停損 ${n2(lo, 1)}</span><span>現價 ${n2(h.price, 1)}</span>
          <span>目標 ${n2(hi, 1)}</span></div>`;
    }
    return `<div class="hold">
      <div class="top">
        <h3>${esc(h.name)} <span class="code">${esc(h.code)}</span></h3>
        <div class="num ${cls(h.unrealized_pnl)}" style="font-size:15px;font-weight:600">
          ${pct(h.unrealized_pct)}</div>
      </div>
      <div class="grid">
        <div><span class="dim">股數</span><span class="mono">${n0(h.shares)}</span></div>
        <div><span class="dim">現價</span><span class="mono">${n2(h.price, 1)}</span></div>
        <div><span class="dim">成本</span><span class="mono">${n2(h.avg_cost, 2)}</span></div>
        <div><span class="dim">市值</span><span class="mono">${n0(h.market_value)}</span></div>
        <div><span class="dim">損益</span><span class="mono ${cls(h.unrealized_pnl)}">${n0(h.unrealized_pnl)}</span></div>
        <div><span class="dim">佔比</span><span class="mono">${h.weight_pct.toFixed(1)}%</span></div>
      </div>
      ${progress}${spark(h.code)}
      ${t ? `<div class="thesis">
        <div class="t">${esc(t.title)}</div>
        <p>${nl(t.rationale)}</p>
        ${t.catalysts ? `<p><span class="faint">催化劑 · </span>${nl(t.catalysts)}</p>` : ''}
        ${t.risks ? `<p><span class="faint">風險 · </span>${nl(t.risks)}</p>` : ''}
        <p class="faint">${esc(t.horizon || '')}${t.conviction ? ` · 信心 ${'●'.repeat(t.conviction)}${'○'.repeat(5 - t.conviction)}` : ''} · 建立於 ${esc(t.created_date)}</p>
      </div>` : ''}
    </div>`;
  }).join('') + `</div>`;
}

function briefBlock() {
  const b = (D.briefs || [])[0];
  if (!b) return `<div class="panel empty">尚未寫入每日簡報</div>`;
  return `<div class="panel">
    ${b.stance ? `<div class="stance">${esc(b.stance)}</div>` : ''}
    ${briefBody(b)}
    <div class="faint" style="margin-top:12px;font-size:11.5px">簡報日期 ${esc(b.date)}</div>
  </div>`;
}

function decisionsTable() {
  const rows = D.decisions.slice(0, 40);
  if (!rows.length) return `<div class="panel empty">尚無決策紀錄</div>`;
  return `<div class="panel scroll"><table>
    <thead><tr><th>日期</th><th>標的</th><th>動作</th><th>理由</th><th>執行</th></tr></thead>
    <tbody>${rows.map(d => `<tr>
      <td class="mono dim">${esc(d.date)}</td>
      <td>${d.code ? `${esc(d.name || '')} <span class="dim">${esc(d.code)}</span>` : '<span class="dim">整體部位</span>'}</td>
      <td><span class="tag ${d.action.toLowerCase()}">${esc(d.action)}</span></td>
      <td>${nl(d.rationale)}</td>
      <td class="dim">${d.executed ? '已成交' : '—'}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function tradesTable() {
  if (!D.trades.length) return `<div class="panel empty">尚無成交紀錄</div>`;
  return `<div class="panel scroll"><table>
    <thead><tr><th>成交時間</th><th>標的</th><th>買賣</th><th class="num">股數</th>
      <th class="num">價格</th><th class="num">價金</th><th class="num">手續費</th>
      <th class="num">證交稅</th><th class="num">現金增減</th><th class="num">已實現</th>
      <th>理由</th></tr></thead>
    <tbody>${D.trades.map(t => `<tr>
      <td class="mono dim">${esc(t.filled_at || t.date)}<br>
        <span class="tag" title="${esc(t.price_source)}">${esc(t.fill_mode)}</span></td>
      <td>${esc(t.name)} <span class="dim">${esc(t.code)}</span></td>
      <td><span class="tag ${t.side.toLowerCase()}">${t.side === 'BUY' ? '買進' : '賣出'}</span></td>
      <td class="num">${n0(t.shares)}</td>
      <td class="num">${n2(t.price, 2)}</td>
      <td class="num">${n0(t.gross)}</td>
      <td class="num dim">${n0(t.fee)}</td>
      <td class="num dim">${t.tax ? n0(t.tax) : '—'}</td>
      <td class="num ${t.side === 'BUY' ? 'down' : 'up'}">${t.side === 'BUY' ? '-' : '+'}${n0(t.net)}</td>
      <td class="num ${cls(t.realized_pnl)}">${t.realized_pnl == null ? '—' : n0(t.realized_pnl)}</td>
      <td style="min-width:220px">${nl(t.reason)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function macroBlock() {
  if (!D.macro.length) return '';
  return `<div class="macro">` + D.macro.map(m => `<div class="mc">
    <div class="n">${esc(m.label)}</div>
    <div class="v">${m.close >= 1000 ? n0(m.close) : n2(m.close, 2)}</div>
    <div class="c ${cls(m.chg_pct)}">${pct(m.chg_pct)} <span class="faint">${esc(m.date.slice(5))}</span></div>
  </div>`).join('') + `</div>`;
}

function watchBlock() {
  if (!D.watchlist.length) return '';
  return `<div class="panel scroll"><table>
    <thead><tr><th>代號</th><th>名稱</th><th class="num">收盤</th>
      <th class="num">當日</th><th class="num">近月</th><th>持有</th></tr></thead>
    <tbody>${D.watchlist.map(w => `<tr>
      <td class="mono dim">${esc(w.code)}</td>
      <td>${esc(w.name)}</td>
      <td class="num">${n2(w.close, 2)}</td>
      <td class="num ${cls(w.chg_pct)}">${pct(w.chg_pct)}</td>
      <td class="num ${cls(w.chg20_pct)}">${pct(w.chg20_pct)}</td>
      <td>${w.held ? '<span class="tag buy">持股</span>' : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

// 市場經驗法則：每條都寫成可證偽的形式，事後回填結果
function playbookBlock() {
  const pb = D.playbook || [];
  if (!pb.length) return '';
  const badge = {UNTESTED: '待檢驗', SUPPORTED: '成立', REFUTED: '不成立', MIXED: '部分成立'};
  const color = {SUPPORTED: 'var(--up)', REFUTED: 'var(--down)', MIXED: 'var(--warn)'};
  return `<div class="holds">` + pb.map(p => `<div class="hold">
    <div class="top">
      <h3>${esc(p.title)}</h3>
      <span class="tag" style="${color[p.status] ? `color:${color[p.status]};border-color:${color[p.status]}` : ''}"
        >${badge[p.status] || esc(p.status)}</span>
    </div>
    <div class="thesis" style="border-top:none;padding-top:8px;margin-top:4px">
      <p><span class="faint">機制 · </span>${nl(p.mechanism)}</p>
      <p><span class="faint">怎麼算它成立 · </span>${nl(p.testable)}</p>
      ${p.verdict ? `<p><span class="faint">結果 · </span>${nl(p.verdict)}</p>` : ''}
      <p class="faint">${esc(p.source)}${p.test_dates ? ` · 檢驗日 ${esc(p.test_dates)}` : ''}</p>
    </div>
  </div>`).join('') + `</div>`;
}

function eventsBlock() {
  if (!D.events.length) return `<div class="panel empty">近期無登錄的行事曆事件</div>`;
  return `<div class="panel">` + D.events.map(e => `<div class="ev">
    <div class="d mono">${esc(e.date)}</div>
    <div class="t">${esc(e.title)}${e.note ? `<div class="dim" style="font-size:12px">${nl(e.note)}</div>` : ''}</div>
    <div class="s">${'★'.repeat(e.importance || 0)}</div>
  </div>`).join('') + `</div>`;
}

function newsItems(items) {
  return items.map(x => `<div class="news-item">
    <div class="h">
      <strong>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</strong>
      ${x.sentiment ? `<span class="tag">${esc(x.sentiment)}</span>` : ''}
      ${x.importance ? `<span class="s">${'★'.repeat(x.importance)}</span>` : ''}
    </div>
    ${x.summary ? `<p>${nl(x.summary)}</p>` : ''}
    <div class="s">${esc(x.source || '')}${x.codes ? ' · ' + esc(x.codes) : ''}</div>
  </div>`).join('');
}

function briefBody(b) {
  const item = (h, v) => v ? `<div class="item"><div class="h">${h}</div><p>${nl(v)}</p></div>` : '';
  return `<div class="brief">
    ${item('總體經濟', b.macro)}
    ${item('台股盤勢', b.tw_market)}
    ${item('AI／半導體', b.ai_sector)}
    ${item('加密貨幣', b.crypto)}
    ${item('關鍵事件', b.key_events)}
    ${item('今日動作', b.actions)}
    ${item('後續預期', b.outlook)}
  </div>`;
}

// 每日紀錄存檔：三個月下來，這一段是整份實驗的主體
function archiveBlock() {
  const dates = new Set();
  D.briefs.forEach(b => dates.add(b.date));
  D.news.forEach(n => dates.add(n.date));
  D.decisions.forEach(d => dates.add(d.date));
  D.trades.forEach(t => dates.add(t.date));
  const sorted = [...dates].sort().reverse();
  if (!sorted.length) return `<div class="panel empty">尚無每日紀錄</div>`;

  const briefBy = Object.fromEntries(D.briefs.map(b => [b.date, b]));
  const group = (arr) => arr.reduce((m, x) => ((m[x.date] ||= []).push(x), m), {});
  const newsBy = group(D.news), decBy = group(D.decisions), trdBy = group(D.trades);

  return sorted.map((date, i) => {
    const b = briefBy[date], nws = newsBy[date] || [],
          dec = decBy[date] || [], trd = trdBy[date] || [];
    const snap = D.snapshots.find(s => s.date === date);
    const bits = [];
    if (trd.length) bits.push(`${trd.length} 筆成交`);
    if (dec.length) bits.push(`${dec.length} 項決策`);
    if (nws.length) bits.push(`${nws.length} 則新聞`);
    if (snap) bits.push(`總資產 ${n0(snap.total_equity)}（${pct(snap.cum_return_pct)}）`);

    return `<details class="panel" style="margin-bottom:10px" ${i === 0 ? 'open' : ''}>
      <summary>
        <span class="mono" style="font-weight:600">${esc(date)}</span>
        ${b && b.stance ? `<span class="dim"> · ${esc(b.stance)}</span>` : ''}
        <div class="s" style="margin-top:3px">${bits.join(' · ') || '無紀錄'}</div>
      </summary>
      <div style="padding-top:14px;border-top:1px solid var(--line);margin-top:12px">
        ${b ? briefBody(b) : ''}
        ${trd.length ? `<div class="sub-h">當日成交</div>` + trd.map(t =>
          `<div class="news-item"><div class="h">
            <span class="tag ${t.side.toLowerCase()}">${t.side === 'BUY' ? '買進' : '賣出'}</span>
            <strong>${esc(t.name)} ${esc(t.code)}</strong>
            <span class="mono">${n0(t.shares)} 股 @ ${n2(t.price, 2)}</span>
            <span class="s">${esc(t.filled_at || '')}</span>
          </div><p>${nl(t.reason)}</p></div>`).join('') : ''}
        ${dec.length ? `<div class="sub-h">當日決策</div>` + dec.map(d =>
          `<div class="news-item"><div class="h">
            <span class="tag ${d.action.toLowerCase()}">${esc(d.action)}</span>
            ${d.code ? `<strong>${esc(d.name || '')} ${esc(d.code)}</strong>`
                     : '<span class="dim">整體部位</span>'}
          </div><p>${nl(d.rationale)}</p></div>`).join('') : ''}
        ${nws.length ? `<div class="sub-h">當日新聞</div>` + newsItems(nws) : ''}
      </div>
    </details>`;
  }).join('');
}
